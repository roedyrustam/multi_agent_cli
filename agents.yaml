agents:
  - name: "Researcher"
    role: "Senior AI Researcher"
    model: "gemini/gemini-2.5-flash"
    description: "Responsible for gathering facts and searching for information."
    skills:
      - "research-expert" # Will map to skills/research-expert.md

  - name: "Writer"
    role: "Technical Writer"
    model: "groq/llama3-8b-8192" # Free tier example
    description: "Responsible for writing clean, structured documentation based on the researcher's output."
    skills:
      - "seo-aeo-landing-page-writer"

  - name: "Coder"
    role: "Senior Software Engineer"
    model: "xai/grok-beta" # Example for Grok
    description: "Writes robust code."
    skills:
      - "typescript-expert"

  - name: "Reviewer"
    role: "Code Reviewer"
    model: "deepseek/deepseek-chat" # Example for DeepSeek
    description: "Reviews code for bugs and security."
    skills:
      - "security-expert"

workflows:
  - name: "research_and_write"
    description: "Research a topic and then write a comprehensive guide."
    steps:
      - agent: "Researcher"
        require_human_approval: true
      - agent: "Writer"
